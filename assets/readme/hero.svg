<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">drslon.ru — personal hub for web, infra and AI-ready work</title>
  <desc id="desc">Matrix-style terminal hero for Alexey Krivoshein's static GitHub Pages site: landings, WordPress, VPS, bots, Yandex Direct and AI-ready services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a08"/>
      <stop offset="55%" stop-color="#071410"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff9c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ff9c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="380" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <!-- soft matrix columns -->
    <g fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.14">
      <text x="980" y="36">01</text><text x="980" y="52">10</text><text x="980" y="68">11</text>
      <text x="1010" y="48">0</text><text x="1010" y="64">1</text><text x="1010" y="80">0</text>
      <text x="1040" y="40">10</text><text x="1040" y="56">01</text><text x="1040" y="72">11</text>
      <text x="1070" y="58">1</text><text x="1070" y="74">0</text><text x="1070" y="90">1</text>
      <text x="1100" y="44">01</text><text x="1100" y="60">10</text><text x="1100" y="76">00</text>
      <text x="1130" y="52">1</text><text x="1130" y="68">1</text><text x="1130" y="84">0</text>
      <text x="1160" y="38">10</text><text x="1160" y="54">01</text><text x="1160" y="70">11</text>
    </g>
    <rect x="0" y="0" width="1200" height="1" fill="url(#glow)"/>
    <rect x="0" y="379" width="1200" height="1" fill="url(#glow)"/>

    <!-- left title block -->
    <g transform="translate(56 48)">
      <rect x="0" y="0" width="210" height="28" rx="14" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.35"/>
      <text x="16" y="19" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">GITHUB PAGES · STATIC HUB</text>

      <text x="0" y="92" fill="#e6fff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">drslon.ru</text>
      <text x="0" y="138" fill="#8fb3a4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="500">Alexey Krivoshein · personal site</text>

      <text x="0" y="188" fill="#c8f5e0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Landings, WordPress, VPS, bots,</text>
      <text x="0" y="216" fill="#c8f5e0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Yandex Direct &amp; AI-ready prep —</text>
      <text x="0" y="244" fill="#00ff9c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">one hub, six service microsites.</text>

      <g transform="translate(0 278)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
        <rect x="0" y="0" width="118" height="30" rx="8" fill="#00ff9c" fill-opacity="0.12" stroke="#00ff9c" stroke-opacity="0.3"/>
        <text x="14" y="20" fill="#00ff9c">RU / EN</text>
        <rect x="128" y="0" width="150" height="30" rx="8" fill="#00ff9c" fill-opacity="0.12" stroke="#00ff9c" stroke-opacity="0.3"/>
        <text x="142" y="20" fill="#00ff9c">day · night auto</text>
        <rect x="288" y="0" width="132" height="30" rx="8" fill="#00ff9c" fill-opacity="0.12" stroke="#00ff9c" stroke-opacity="0.3"/>
        <text x="302" y="20" fill="#00ff9c">llms.txt ready</text>
      </g>
    </g>

    <!-- right terminal proof -->
    <g transform="translate(700 42)">
      <rect width="448" height="296" rx="16" fill="#020806" stroke="#00ff9c" stroke-opacity="0.28"/>
      <rect width="448" height="36" rx="16" fill="#071a12"/>
      <rect y="20" width="448" height="16" fill="#071a12"/>
      <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
      <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
      <circle cx="58" cy="18" r="5" fill="#27c93f"/>
      <text x="78" y="22" fill="#3d7a62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">root@drslon:~ services --map</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
        <text x="24" y="68" fill="#3d7a62">$</text>
        <text x="42" y="68" fill="#00ff9c">tree hub/</text>
        <text x="24" y="94" fill="#8fb3a4">drslon.ru</text>
        <text x="42" y="114" fill="#00ff9c">├─</text><text x="70" y="114" fill="#e6fff4">www.krivoshein.site</text>
        <text x="42" y="134" fill="#00ff9c">├─</text><text x="70" y="134" fill="#e6fff4">krivoshein.site/blog</text>
        <text x="42" y="154" fill="#00ff9c">├─</text><text x="70" y="154" fill="#e6fff4">landing · wordpress · vps</text>
        <text x="42" y="174" fill="#00ff9c">├─</text><text x="70" y="174" fill="#e6fff4">bots · direct · ai-ready</text>
        <text x="42" y="194" fill="#00ff9c">└─</text><text x="70" y="194" fill="#e6fff4">*.krivoshein.site</text>
        <text x="24" y="224" fill="#3d7a62">$</text>
        <text x="42" y="224" fill="#8fb3a4">open</text>
        <text x="90" y="224" fill="#00ff9c">blog · www · hub</text>
        <text x="24" y="254" fill="#3d7a62">$</text>
        <text x="42" y="254" fill="#8fb3a4">status</text>
        <text x="110" y="254" fill="#00ff9c">online · contract ИП</text>
        <rect x="320" y="242" width="8" height="16" fill="#00ff9c" opacity="0.9"/>
      </g>
    </g>
  </g>
</svg>

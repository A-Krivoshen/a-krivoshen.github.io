<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">Stack section</title>
  <desc id="desc">Section header: static HTML, CSS, JS on GitHub Pages with day and night theme.</desc>
  <rect width="1200" height="140" rx="22" fill="#050a08"/>
  <rect x="1" y="1" width="1198" height="138" rx="21" fill="none" stroke="#00ff9c" stroke-opacity="0.18"/>
  <text x="48" y="52" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">// stack</text>
  <text x="48" y="96" fill="#e6fff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="750">No build step. Ship static.</text>
  <g transform="translate(760 42)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect width="88" height="34" rx="10" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.3"/>
    <text x="18" y="22" fill="#00ff9c">HTML</text>
    <rect x="98" y="0" width="72" height="34" rx="10" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.3"/>
    <text x="116" y="22" fill="#00ff9c">CSS</text>
    <rect x="180" y="0" width="64" height="34" rx="10" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.3"/>
    <text x="196" y="22" fill="#00ff9c">JS</text>
    <rect x="0" y="44" width="140" height="34" rx="10" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.3"/>
    <text x="18" y="66" fill="#00ff9c">GitHub Pages</text>
    <rect x="150" y="44" width="150" height="34" rx="10" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.3"/>
    <text x="168" y="66" fill="#00ff9c">day · night UI</text>
  </g>
</svg>

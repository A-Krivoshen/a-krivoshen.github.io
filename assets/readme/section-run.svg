<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">Local preview section</title>
  <desc id="desc">Section header for running the site locally with a simple HTTP server.</desc>
  <rect width="1200" height="140" rx="22" fill="#050a08"/>
  <rect x="1" y="1" width="1198" height="138" rx="21" fill="none" stroke="#00ff9c" stroke-opacity="0.18"/>
  <text x="48" y="52" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">// first use</text>
  <text x="48" y="96" fill="#e6fff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="750">Clone → serve → open.</text>
  <g transform="translate(720 48)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect width="420" height="48" rx="12" fill="#020806" stroke="#00ff9c" stroke-opacity="0.28"/>
    <text x="18" y="30" fill="#3d7a62">$</text>
    <text x="36" y="30" fill="#00ff9c">python3 -m http.server 8080</text>
  </g>
</svg>

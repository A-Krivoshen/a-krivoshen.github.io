<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">drslon.ru service ecosystem map</title>
  <desc id="desc">Hub site drslon.ru connected to six service microsites: landing, wordpress, vps, bots, direct, ai-ready on krivoshein.site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a08"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00ff9c" fill-opacity="0.7"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#00ff9c" stroke-opacity="0.16"/>

  <text x="56" y="48" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">// ecosystem</text>
  <text x="56" y="84" fill="#e6fff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="750">Hub · main site · blog · six tracks</text>
  <text x="56" y="114" fill="#8fb3a4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">www.krivoshein.site + blog · microsites own price &amp; CTA · drslon.ru is the services hub.</text>

  <!-- hub -->
  <g transform="translate(460 150)">
    <rect width="280" height="88" rx="16" fill="#00ff9c" fill-opacity="0.1" stroke="#00ff9c" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="140" y="38" text-anchor="middle" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">HUB</text>
    <text x="140" y="64" text-anchor="middle" fill="#e6fff4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="750">drslon.ru</text>
  </g>

  <!-- connectors -->
  <g stroke="#00ff9c" stroke-opacity="0.35" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M520 238 C 420 238, 280 250, 200 286"/>
    <path d="M560 238 C 500 250, 420 270, 380 286"/>
    <path d="M600 238 C 600 250, 600 270, 600 286"/>
    <path d="M640 238 C 700 250, 780 270, 820 286"/>
    <path d="M680 238 C 780 250, 920 270, 1000 286"/>
    <path d="M700 220 C 860 200, 980 180, 1040 168"/>
  </g>

  <!-- service cards row -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <!-- landing -->
    <g transform="translate(56 300)">
      <rect width="168" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.28"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">01</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">Landings</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">from 25k ₽</text>
    </g>
    <!-- wp -->
    <g transform="translate(244 300)">
      <rect width="168" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.28"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">02</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">WordPress</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">support / fixes</text>
    </g>
    <!-- vps -->
    <g transform="translate(432 300)">
      <rect width="168" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.28"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">03</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">VPS</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">setup from 10k ₽</text>
    </g>
    <!-- bots -->
    <g transform="translate(620 300)">
      <rect width="168" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.28"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">04</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">Bots MAX</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">from 40k ₽</text>
    </g>
    <!-- direct -->
    <g transform="translate(808 300)">
      <rect width="168" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.28"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">05</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">Direct</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">ads for SMB</text>
    </g>
    <!-- ai-ready -->
    <g transform="translate(996 140)">
      <rect width="148" height="84" rx="14" fill="#071a12" stroke="#00ff9c" stroke-opacity="0.45"/>
      <text x="16" y="28" fill="#00ff9c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">06</text>
      <text x="16" y="52" fill="#e6fff4" font-size="16" font-weight="700">AI-ready</text>
      <text x="16" y="72" fill="#8fb3a4" font-size="12">schema · llms</text>
    </g>
  </g>
</svg>
